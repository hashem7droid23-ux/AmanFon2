name: Build Aman Phone APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/AmanPhone-debug.apk
          echo "APK successfully copied to release-output/AmanPhone-debug.apk"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AmanPhone-debug-apk
          path: release-output/AmanPhone-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/AmanPhone-debug.apk
          name: "أمان فون - إصدار APK جديد (${{ github.ref_name }})"
          tag_name: ${{ github.ref_name || 'v1.0.0-apk' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 تطبيق أمان فون (Aman Phone)
            المنظومة الوطنية لتتبع وحماية الهواتف المفقودة والمسروقة في الجمهورية اليمنية.
            
            ### 👨‍💻 المطور والمصمم:
            - **المهندس: هاشم القديمي (Hashem Al-Qodimy)**
            - **فيسبوك:** [HashemAlQodimy](https://www.facebook.com/HashemAlQodimy)
            
            ### 📥 التحميل والتثبيت:
            - قم بتحميل ملف `AmanPhone-debug.apk` المرفق وتثبيته مباشرة على جهازك بنظام أندرويد.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
