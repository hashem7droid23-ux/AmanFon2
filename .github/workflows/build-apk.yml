name: Build Aman Phone APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Restore or Generate debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore via keytool..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "Restoring google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "550389528405",
              "project_id": "gen-lang-client-0428838696",
              "storage_bucket": "gen-lang-client-0428838696.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:550389528405:android:0b2a98a973fd00ba2221dc",
                  "android_client_info": {
                    "package_name": "com.aistudio.lostphone.ymndx"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "550389528405-cap0jq2qp73mi3u8a95h37r206o7ubtd.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyC_lRrLC4BobUJLMNsOyGGXGafiipWiNJI"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          ls -la app/google-services.json

      - name: Ensure .env file exists
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/AmanPhone-debug.apk
          echo "APK successfully copied to release-output/AmanPhone-debug.apk"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AmanPhone-debug-apk
          path: release-output/AmanPhone-debug.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/AmanPhone-debug.apk
          name: "📱 تطبيق أمان فون - ملف APK جاهز للتثبيت المباشر"
          tag_name: "v1.0-apk"
          make_latest: "true"
          draft: false
          prerelease: false
          body: |
            ## 📱 تطبيق أمان فون (Aman Phone)
            المنظومة الوطنية لتتبع وحماية الهواتف المفقودة والمسروقة في الجمهورية اليمنية 🇾🇪
            
            ### 👨‍💻 المطور والمصمم:
            - **المهندس:** هاشم القديمي (Hashem Al-Qodimy)
            - **صفحة فيسبوك:** [HashemAlQodimy](https://www.facebook.com/HashemAlQodimy)
            
            ### 📥 التحميل المباشر (ملف APK جاهز بدون ضغط):
            - اضغط على الرابط بالأسفل: **`AmanPhone-debug.apk`** لتحميل وتثبيت التطبيق مباشرة وبدون الحاجة لفك الضغط.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
