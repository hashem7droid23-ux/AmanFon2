name: Build Aman Phone APK (CI / Debug)

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'update.json'
      - 'RELEASE_NOTES.md'
      - 'ci/**'
      - '.github/**'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'update.json'
      - 'RELEASE_NOTES.md'
      - 'ci/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Restore or Generate debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore via keytool..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Ensure google-services.json exists
        run: |
          if [ ! -s app/src/main/res/values/firebase_applet_config.xml ]; then
            mkdir -p app/src/main/res/values
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-bbdab0c6-e15e-48f0-8ca7-0910319d9bda</string>
          </resources>
          EOF
          fi
          if [ ! -f app/google-services.json ]; then
            echo "Restoring google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "550389528405",
              "project_id": "gen-lang-client-0428838696",
              "storage_bucket": "gen-lang-client-0428838696.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:550389528405:android:0b2a98a973fd00ba2221dc",
                  "android_client_info": {
                    "package_name": "com.aistudio.lostphone.ymndx"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "550389528405-jni48h7suco2an6bi2tum12ai4nbu1gr.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.lostphone.ymndx",
                      "certificate_hash": "ffd51681acb73684a564303a9538969254532704"
                    }
                  },
                  {
                    "client_id": "550389528405-la3hq7qjottukp70ef95lgan75dvsack.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.lostphone.ymndx",
                      "certificate_hash": "35815e7be301e2b23128f6643be304e17e2e55ab"
                    }
                  },
                  {
                    "client_id": "550389528405-oala1t19e633nujkda31nrtufna5hn0d.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.lostphone.ymndx",
                      "certificate_hash": "3b046ba1bc524df12b51343a40182b6f38a3dc1e"
                    }
                  },
                  {
                    "client_id": "550389528405-oq0e2uertlvodeqa1hcr9to8l0fd6rcb.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.lostphone.ymndx",
                      "certificate_hash": "a5ee2fba934872a3e5589bba0092ca156fdb8ed8"
                    }
                  },
                  {
                    "client_id": "550389528405-cap0jq2qp73mi3u8a95h37r206o7ubtd.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyC_lRrLC4BobUJLMNsOyGGXGafiipWiNJI"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "550389528405-cap0jq2qp73mi3u8a95h37r206o7ubtd.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          ls -la app/google-services.json

      - name: Ensure .env file exists
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/AmanPhone-debug.apk
          echo "APK successfully copied to release-output/AmanPhone-debug.apk"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AmanPhone-debug-apk
          path: release-output/AmanPhone-debug.apk
          retention-days: 30
